name: Local workbench checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Syntax and business checks
        run: |
          node --check templates/local-workbench/public/app.js
          node --experimental-strip-types --test tests/*.test.mjs
